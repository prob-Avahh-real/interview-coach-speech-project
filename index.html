<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 面试陪跑官 — 口语练习 + 模型答案</title>
<style>
:root { color-scheme: light; --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --text2: #64748b; --accent: #6366f1; --accent2: #818cf8; --green: #22c55e; --red: #ef4444; --amber: #f59e0b; --border: #e2e8f0; --tag-bg: #eef2ff; }

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
.container { max-width: 840px; margin: 0 auto; padding: 20px; }

.room-header { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #4338ca 100%); color: white; border-radius: 20px; padding: 32px; margin-bottom: 24px; position: relative; overflow: hidden; }
.room-header::after { content: ''; position: absolute; top: -50%; right: -20%; width: 300px; height: 300px; background: radial-gradient(circle, rgba(99,102,241,.3), transparent 70%); border-radius: 50%; }
.room-header h1 { font-size: 22px; font-weight: 700; position: relative; z-index: 1; }
.room-header .sub { font-size: 13px; opacity: .75; margin-top: 4px; position: relative; z-index: 1; }
.room-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.12); border-radius: 20px; padding: 4px 14px; font-size: 12px; margin-top: 12px; position: relative; z-index: 1; }
.room-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.interviewer-card { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
.avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #a855f7); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; color: white; }
.interviewer-info .name { font-weight: 700; font-size: 15px; }
.interviewer-info .title { font-size: 12px; color: var(--text2); }

.question-bubble { background: var(--card); border: 2px solid #c7d2fe; border-radius: 18px; padding: 24px; margin-bottom: 20px; position: relative; }
.question-bubble::before { content: ''; position: absolute; top: -10px; left: 30px; width: 20px; height: 20px; background: var(--card); border-left: 2px solid #c7d2fe; border-top: 2px solid #c7d2fe; transform: rotate(45deg); }
.q-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
.q-text { font-size: 18px; font-weight: 600; line-height: 1.6; }
.q-hint { font-size: 13px; color: var(--amber); margin-top: 12px; padding: 10px 14px; background: #fffbeb; border-radius: 10px; border: 1px solid #fde68a; }

.timer-bar-wrap { background: var(--border); border-radius: 8px; height: 6px; margin-bottom: 20px; overflow: hidden; }
.timer-bar-fill { height: 100%; background: var(--accent); border-radius: 8px; transition: width .3s linear; }
.timer-bar-fill.warn { background: var(--amber); }
.timer-bar-fill.danger { background: var(--red); }
.timer-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); margin-bottom: 4px; }

.speech-stage { background: var(--card); border: 2px solid var(--border); border-radius: 20px; padding: 32px; text-align: center; margin-bottom: 20px; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all .3s; }
.speech-stage.recording { border-color: var(--red); box-shadow: 0 0 0 4px rgba(239,68,68,.1); animation: recordingPulse 2s infinite; }
@keyframes recordingPulse { 0%,100%{box-shadow: 0 0 0 4px rgba(239,68,68,.1)} 50%{box-shadow: 0 0 0 8px rgba(239,68,68,.05)} }
.speech-stage.done { border-color: var(--green); }
.recording-indicator { display: none; align-items: center; gap: 8px; margin-bottom: 16px; }
.recording-indicator.show { display: flex; }
.rec-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--red); animation: pulse 1s infinite; }
.rec-text { font-size: 12px; color: var(--red); font-weight: 600; letter-spacing: 1px; }
.transcript-live { font-size: 16px; line-height: 1.8; color: var(--text); text-align: left; width: 100%; max-height: 300px; overflow-y: auto; padding: 8px 0; }
.transcript-live .interim { color: var(--text2); font-style: italic; }
.transcript-placeholder { color: var(--text2); font-size: 14px; }

.btn { padding: 12px 28px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; font-family: inherit; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: white; font-size: 16px; padding: 16px 40px; border-radius: 14px; }
.btn-primary:hover:not(:disabled) { background: #4f46e5; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,.3); }
.btn-secondary { background: var(--tag-bg); color: var(--accent); }
.btn-outline { background: none; border: 2px solid var(--border); color: var(--text2); }
.btn-outline:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 8px; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }

/* ===== ANALYSIS ===== */
.analysis-panel { display: none; margin-top: 20px; }
.analysis-panel.show { display: block; }
.analysis-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 12px; }
.analysis-card h4 { font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

.score-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.score-chip { text-align: center; padding: 14px; border-radius: 12px; background: #f8fafc; border: 1px solid var(--border); }
.score-chip .score-val { font-size: 32px; font-weight: 800; }
.score-chip .score-label { font-size: 11px; color: var(--text2); margin-top: 4px; }
.score-chip.good .score-val { color: var(--green); }
.score-chip.ok .score-val { color: var(--amber); }
.score-chip.poor .score-val { color: var(--red); }

.highlight-filler { background: rgba(239,68,68,.15); padding: 1px 4px; border-radius: 3px; }
.full-transcript { background: #f8fafc; border-radius: 10px; padding: 16px; font-size: 14px; line-height: 1.8; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }

/* ===== MODEL ANSWER ===== */
.model-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
.model-tab { padding: 10px 20px; border: none; background: none; font-size: 13px; font-weight: 600; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .2s; font-family: inherit; }
.model-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.gap-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.gap-row:last-child { border-bottom: none; }
.gap-icon { flex-shrink: 0; width: 24px; text-align: center; font-size: 16px; }
.gap-content { flex: 1; }
.gap-label { font-weight: 600; font-size: 13px; }
.gap-detail { color: var(--text2); font-size: 12px; margin-top: 2px; }
.gap-miss { background: #fef2f2; border-left: 3px solid var(--red); padding: 6px 10px; border-radius: 0 6px 6px 0; margin-top: 4px; font-size: 12px; }
.gap-have { background: #f0fdf4; border-left: 3px solid var(--green); padding: 6px 10px; border-radius: 0 6px 6px 0; margin-top: 4px; font-size: 12px; }

.model-answer-box { background: linear-gradient(135deg, #f0fdf4, #ecfdf5); border: 2px solid #bbf7d0; border-radius: 14px; padding: 24px; font-size: 14px; line-height: 1.9; }
.model-answer-box .phase { margin-bottom: 14px; }
.model-answer-box .phase:last-child { margin-bottom: 0; }
.model-answer-box .phase-label { font-weight: 700; color: var(--green); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.model-answer-box .phase-text { color: var(--text); }

.overall-score-banner { display: flex; align-items: center; gap: 16px; background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 12px; }
.score-circle { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; flex-shrink: 0; }
.score-circle.great { background: #dcfce7; color: #15803d; }
.score-circle.good { background: #dbeafe; color: #1d4ed8; }
.score-circle.fair { background: #fef3c7; color: #b45309; }
.score-circle.weak { background: #fef2f2; color: #dc2626; }
.score-breakdown { font-size: 13px; color: var(--text2); }
.score-breakdown .sbl { font-weight: 600; color: var(--text); }

.checkpoint-table { width: 100%; font-size: 13px; border-collapse: collapse; }
.checkpoint-table th { text-align: left; padding: 8px 12px; background: #f8fafc; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text2); font-weight: 600; }
.checkpoint-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.checkpoint-table .cp-name { font-weight: 600; }
.checkpoint-table .cp-score { text-align: center; font-weight: 700; font-size: 16px; }
.checkpoint-table .cp-fix { font-size: 12px; color: var(--text2); }

.picker-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 8px; margin-bottom: 16px; }
.picker-btn { padding: 10px; border: 2px solid var(--border); border-radius: 10px; background: white; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .2s; text-align: center; font-family: inherit; color: var(--text); }
.picker-btn:hover { border-color: var(--accent); }
.picker-btn.active { border-color: var(--accent); background: var(--tag-bg); color: var(--accent); }

.section-label { font-size: 12px; color: var(--text2); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.hidden { display: none !important; }

/* Preview panel */
.preview-panel { margin-top: 14px; padding: 16px; background: #f8fafc; border-radius: 12px; border: 1px solid var(--border); font-size: 13px; line-height: 1.7; }
.preview-panel .preview-phase { padding: 8px 0; border-bottom: 1px solid var(--border); }
.preview-panel .preview-phase:last-child { border-bottom: none; }
.preview-panel .preview-phase-label { font-weight: 700; color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
.preview-panel .preview-phase-text { color: var(--text2); margin-top: 2px; }
.preview-panel .preview-mistakes { margin-top: 10px; padding: 10px; background: #fef2f2; border-radius: 8px; }
.preview-panel .preview-mistakes-title { font-weight: 700; color: var(--red); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }

@media (max-width: 500px) {
  .container { padding: 12px; }
  .room-header { padding: 20px; border-radius: 14px; }
  .q-text { font-size: 15px; }
  .speech-stage { padding: 20px 16px; }
  .btn-primary { padding: 14px 24px; font-size: 14px; }
  .model-tab { padding: 8px 12px; font-size: 12px; }
}
</style>
</head>
<body>
<div class="container">

<div class="room-header">
  <h1>🎙️ 面试模拟间</h1>
  <div class="sub">后端开发 · 全栈开发 · 架构师</div>
  <div class="room-badge"><span class="dot"></span> 开口说 → 看分析 → 对比完美答案 → 迭代到接近完美</div>
</div>

<div class="interviewer-card">
  <div class="avatar">🧑‍💻</div>
  <div class="interviewer-info"><div class="name">Alex Chen</div><div class="title">Staff Engineer · 面试官</div></div>
</div>

<div class="question-bubble" id="questionBubble">
  <div class="q-label" id="qCategory">行为面试 · STAR</div>
  <div class="q-text" id="qText">点击下方按钮，我会向你提问。听到问题后，像真实面试一样开口回答。</div>
  <div class="q-hint hidden" id="qHint"></div>
  <button class="btn btn-outline btn-sm" id="btnPreview" onclick="togglePreview()" style="margin-top:12px;">👁️ 答题前先看完美答案结构</button>
  <div class="preview-panel hidden" id="previewPanel"></div>
</div>

<div class="timer-info"><span id="timerLabel">准备就绪</span><span id="timerClock">02:00</span></div>
<div class="timer-bar-wrap"><div class="timer-bar-fill" id="timerBar" style="width:100%"></div></div>

<div class="speech-stage" id="speechStage">
  <div class="recording-indicator" id="recIndicator"><span class="rec-dot"></span><span class="rec-text">RECORDING</span></div>
  <div class="transcript-live" id="transcriptLive"><span class="transcript-placeholder" id="transcriptPlaceholder">点击「开始回答」然后开口说</span></div>
  <div class="btn-group">
    <button class="btn btn-primary" id="btnRecord" onclick="startAnswering()">🎤 开始回答</button>
    <button class="btn btn-outline hidden" id="btnStop" onclick="stopAnswering()">⏹ 回答完毕</button>
    <button class="btn btn-secondary btn-sm hidden" id="btnReplay" onclick="replayQuestion()">🔊 重听题目</button>
    <button class="btn btn-secondary btn-sm hidden" id="btnRetry" onclick="retryQuestion()">🔄 再练一次</button>
  </div>
</div>

<div class="section-label" style="margin-top:24px;">🎯 选题类型</div>
<div class="picker-grid" id="pickerGrid">
  <button class="picker-btn active" data-cat="behavioral">行为面试</button>
  <button class="picker-btn" data-cat="sysdesign">系统设计</button>
  <button class="picker-btn" data-cat="tech">技术深度</button>
  <button class="picker-btn" data-cat="project">项目经验</button>
</div>
<button class="btn btn-secondary btn-sm" onclick="pickRandomQuestion()" style="width:100%;">🎲 随机出题</button>

<!-- ===== ANALYSIS PANEL ===== -->
<div class="analysis-panel" id="analysisPanel">
  <div class="section-label" style="margin-top:8px;">📊 回答分析</div>

  <!-- Overall Score -->
  <div class="overall-score-banner" id="overallScoreBanner">
    <div class="score-circle" id="overallScoreCircle">-</div>
    <div class="score-breakdown" id="overallScoreBreakdown"></div>
  </div>

  <!-- Dimension Scores -->
  <div class="analysis-card">
    <h4>📊 分维度评分</h4>
    <div id="dimensionTable"></div>
  </div>

  <!-- Content vs Model Answer tabs -->
  <div class="analysis-card">
    <div class="model-tabs">
      <button class="model-tab active" data-subtab="yourAnswer">📝 你的回答</button>
      <button class="model-tab" data-subtab="modelAnswer">⭐ 完美答案</button>
      <button class="model-tab" data-subtab="gapAnalysis">🔍 差距分析</button>
    </div>
    <div id="subtab-yourAnswer"></div>
    <div id="subtab-modelAnswer" class="hidden"></div>
    <div id="subtab-gapAnalysis" class="hidden"></div>
  </div>

  <!-- Star Check -->
  <div class="analysis-card" id="starCheckCard">
    <h4>⭐ STAR 结构检测</h4>
    <div id="starCheckResult" style="font-size:13px;line-height:1.8;"></div>
  </div>

  <!-- Improvement plan -->
  <div class="analysis-card">
    <h4>🎯 改进行动计划</h4>
    <div id="improvementPlan" style="font-size:13px;line-height:1.8;color:var(--text2);"></div>
  </div>

  <div class="btn-group" style="justify-content:flex-start;">
    <button class="btn btn-primary" onclick="retryQuestion()">🔄 按建议重新练习</button>
    <button class="btn btn-outline" onclick="nextQuestion()">▶ 换一题</button>
    <button class="btn btn-outline" onclick="pickRandomQuestion()">🎲 随机出题</button>
  </div>
</div>

<div class="section-label" style="margin-top:24px;">📋 本次练习记录</div>
<div id="practiceHistory" style="font-size:13px;color:var(--text2);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;min-height:60px;">还没有练习记录</div>

</div>

<script>
// ===== COMPLETE QUESTION BANK WITH MODEL ANSWERS =====
const questions = {
  behavioral: [
    {
      id:'b1',
      q:'Tell me about a time you had a conflict with a colleague about a technical decision. How did you resolve it?',
      hint:'S: 项目背景 + 团队规模。T: 你俩的分歧在哪。A: 你具体怎么沟通和推动的。R: 最终决策 + 团队关系。',
      model: {
        structure:'STAR structure, ~90-120 seconds, 150-250 words',
        checkpoints:[
          {name:'S - Sets scene', weight:10, detect:['team','project','company','working on','building','we were']},
          {name:'T - Clear disagreement', weight:10, detect:['disagree','different','conflict','argued','disagreed','thought','wanted to']},
          {name:'A - Your specific actions', weight:30, detect:['i proposed','i suggested','i wrote','i benchmarked','i tested','i showed','i scheduled','i asked','i listened','i compromised','i suggested we']},
          {name:'A - Data-driven approach', weight:15, detect:['data','benchmark','metric','numbers','test','experiment','prototype','measured','compared','profiling']},
          {name:'R - Concrete outcome', weight:15, detect:['result','ended up','decided','chose','agreed','outcome','resolution','ultimately','finally']},
          {name:'R - Relationship maintained', weight:10, detect:['relationship','still','continued','respect','collaborated','worked together','better']},
          {name:'I vs We ratio > 2:1', weight:10, special:'iwe'},
        ],
        modelAnswer:[
          {phase:'Situation (15s)', text:'"In my last role as a senior backend engineer at [Company], our team of 5 was building a real-time data pipeline processing 500k events/sec. We had a tight deadline for a client launch."'},
          {phase:'Task (15s)', text:'"A senior colleague wanted to use Kafka Streams for the entire pipeline, while I believed a combination of plain Kafka consumers + a lightweight in-memory processing layer would give us better latency control and simpler debugging."'},
          {phase:'Action (60s)', text:'"Rather than arguing in meetings, I spent an evening building a quick benchmark comparing both approaches against our actual workload. I presented the data showing that the Kafka Streams approach added ~80ms P99 latency and made backpressure handling more opaque. I also acknowledged where his approach was better — stateful operations like windowed aggregations. I proposed a hybrid: plain consumers for the latency-sensitive path, Kafka Streams for aggregation jobs. I made sure to frame it as \'building on his idea\' rather than rejecting it."'},
          {phase:'Result (20s)', text:'"He agreed the data was compelling. We shipped the hybrid approach. P99 latency was 45ms vs our 200ms target. More importantly, he and I ended up co-authoring an internal tech talk on the pattern, and our working relationship actually improved because of how we handled the disagreement."'},
        ],
        commonMistakes:['Blaming the colleague ("they were wrong")','No data/prototype to back up argument','Not acknowledging the other person\'s valid points','Saying "we resolved it" without showing YOUR specific actions'],
      },
    },
    {
      id:'b2',
      q:'Describe a project that failed or didn\'t go as planned. What did you learn?',
      hint:'不要甩锅，不要伪装成成功故事。展示你如何面对失败、承担责任、从中学习。',
      model: {
        structure:'STAR with emphasis on lessons learned, ~120s, 200-300 words',
        checkpoints:[
          {name:'S - Honest project context', weight:10, detect:['project','team','building','working on','goal','target']},
          {name:'T - Your role clearly stated', weight:10, detect:['my role','i was responsible','i owned','i led','my job']},
          {name:'A - Took ownership of failure', weight:20, detect:['i should have','i missed','i didn\'t','i underestimated','i assumed','my mistake','i failed to']},
          {name:'A - Actions to mitigate', weight:20, detect:['i tried','i attempted','i pivoted','i changed','i adjusted','i raised','i escalated','i communicated']},
          {name:'R - Concrete lesson', weight:20, detect:['learned','realized','understood','lesson','now i','since then','changed my approach']},
          {name:'R - Applied lesson later', weight:10, detect:['applied','later','next project','since then','now i always','subsequent']},
          {name:'Not blaming others', weight:10, special:'noblame'},
        ],
        modelAnswer:[
          {phase:'Situation', text:'"At [Company], I was the tech lead for a microservice migration project. We were breaking down a monolith that powered our core checkout flow, serving 50k transactions/day."'},
          {phase:'Task', text:'"My responsibility was designing the new service boundaries and orchestrating the migration without disrupting live checkout."'},
          {phase:'Action (failure + response)', text:'"I made a critical mistake: I designed the service split based on our existing code structure rather than the actual runtime dependencies. I didn\'t profile the production traffic patterns carefully enough. Three weeks in, latency spiked 400% because I\'d split two tightly-coupled modules into separate services with synchronous HTTP calls. I owned it immediately — told my manager and the team that my design was the issue. I then spent a weekend profiling prod traffic, redrew the boundaries based on actual call graphs, and proposed keeping those modules together with an async event bridge for the truly independent parts."'},
          {phase:'Result', text:'"We course-corrected in 2 weeks. I learned that architecture decisions must be data-driven, not intuition-driven. On my next project, I instrumented production traces BEFORE proposing any service split. That project shipped with zero latency regressions."'},
        ],
        commonMistakes:['Picking a "failure" that was actually a success','Blaming external factors ("the requirements changed")','Not showing what YOU specifically did wrong','Skipping the lesson or making it vague'],
      },
    },
    {
      id:'b3',
      q:'Tell me about a time you had to influence a decision without having formal authority.',
      hint:'S: 跨团队场景。T: 你要推动什么决策。A: 数据说服？找盟友？原型 demo？R: 决策结果 + 人脉建立。',
      model: {
        structure:'STAR, ~120s, 180-280 words. Key: show influence tactics.',
        checkpoints:[
          {name:'S - Cross-team context', weight:10, detect:['team','another','different','cross','other team','organization','department']},
          {name:'T - Decision at stake', weight:15, detect:['needed to','had to','wanted to','decision','convince','persuade','get them to','adopt']},
          {name:'A - Data/evidence used', weight:20, detect:['data','numbers','benchmark','research','analysis','showed','presented','metrics']},
          {name:'A - Built alliances', weight:15, detect:['talked to','met with','aligned','got','support','sponsor','champion','allies']},
          {name:'A - Prototype/PoC', weight:10, detect:['prototype','proof of concept','demo','built','showed','working example']},
          {name:'R - Decision outcome', weight:15, detect:['adopted','agreed','changed','decided','approved','moved forward','implemented']},
          {name:'I-led language', weight:15, special:'iwe'},
        ],
        modelAnswer:[
          {phase:'Situation', text:'"Our infrastructure team planned to standardize on a specific message queue for all inter-service communication. My team ran latency-sensitive trading services where that queue\'s P99 latency of 50ms was unacceptable — we needed <5ms."'},
          {phase:'Task', text:'"I needed to convince the infra team to allow us to use an alternative without undermining their standardization effort."'},

          {phase:'Breakdown', text:'"Cache breakdown: a hot key expires, and suddenly all concurrent requests for it hit the DB simultaneously. Think a viral product\'s cache entry expiring during a flash sale. Solutions: (1) Distributed mutex lock — use Redis SETNX to allow only one thread to rebuild the cache, others wait or get stale data. (2) Never expire hot keys — use logical expiration: store a timestamp in the value, application checks if it\'s stale and refreshes async. (3) Background preheating — a scheduled job refreshes hot keys before they expire."'},
          {phase:'Avalanche', text:'"Cache avalanche: many keys expire at the same time, or the cache cluster itself goes down. Massive traffic suddenly hits the DB. Solutions: (1) Randomize TTLs — base TTL ± 20% random jitter. (2) Multi-level caching — L1 in-process (Caffeine/Guava) with short TTL, L2 Redis, L3 DB. Even if Redis goes down, L1 absorbs reads. (3) Circuit breaker pattern — when DB response time spikes, stop sending traffic and serve degraded responses. (4) Redis cluster with replication — avoid single point of failure. (5) Rate limit at the gateway to protect the DB."'},

      q:'Tell me about a production incident you handled. Root cause? How did you prevent recurrence?',
      hint:'时间线完整：发现→止损→定位→修复→复盘。展示压力下的组织和沟通能力。',
      model: {
        structure:'Timeline → Your actions → Root cause → Prevention → Lessons. ~3 min.',
        checkpoints:[
          {name:'Incident impact quantified', weight:15, detect:['down','outage','error','latency','affected','users','minutes','hours','lost']},
          {name:'Detection + triage actions', weight:20, detect:['alert','pager','noticed','detected','dashboard','monitor','discovered']},
          {name:'Mitigation before root cause', weight:20, detect:['rollback','revert','restart','scale','circuit breaker','degrade','drain','traffic']},
          {name:'Root cause deep analysis', weight:20, detect:['root cause','because','caused','triggered','found','discovered','race condition','memory leak','deadlock']},
          {name:'Prevention measures', weight:15, detect:['prevent','added','alert','test','monitor','changed','process','runbook','automated']},
          {name:'Communication during incident', weight:10, detect:['communicated','updated','posted','told','stakeholder','status page','slack','channel']},
        ],
        modelAnswer:[
          {phase:'The incident', text:'"At 2:30am, I got paged: checkout was returning 500 errors for 30% of traffic. $15k/minute revenue loss. I jumped on within 2 minutes."'},
          {phase:'Triage & mitigation', text:'"First action: checked the dashboard — latency on the inventory service was 20s P99 (normally 50ms). Rather than debugging the root cause while losing money, I immediately diverted traffic to a read-only fallback (cache-based inventory check with 30s staleness). This stopped the bleeding — checkout was functional within 8 minutes, albeit with slightly stale inventory."'},
          {phase:'Root cause', text:'"After traffic was stable, I investigated. A deployment 30 minutes earlier had changed the database connection pool size from 50 to 20 (a config typo in a terraform variable). Under normal load, 20 connections was fine. But a batch job had kicked off at 2am that consumed 18 connections for a report, leaving only 2 for the API — causing a connection wait queue that cascaded into timeouts."'},
          {phase:'Prevention', text:'"Three fixes: (1) Added a pre-commit hook that validates .tfvars values against allowed ranges. (2) Wrote a load test that specifically tests connection pool exhaustion scenarios. (3) Added a dashboard panel for connection pool utilization with a pager alert at 70%. (4) Updated the runbook with this exact failure pattern — next time someone sees high DB latency during a deploy window, they check connection pools first."'},
          {phase:'Lesson', text:'"The meta-lesson: always mitigate first, investigate second. The revenue we saved by rolling back in 8 minutes instead of debugging for 30 minutes was roughly $330k."'},
        ],
        commonMistakes:['Debugging before mitigating (losing money while investigating)','Vague root cause ("a config issue") without explaining the cascade','No specific prevention measures — "we added monitoring" is too vague','No mention of communication during the incident'],

};

const catLabels = { behavioral:'行为面试', sysdesign:'系统设计', tech:'技术深度', project:'项目经验' };

// ===== STATE =====
let currentQuestion = null;
let currentCat = 'behavioral';
let currentQuestionData = null;
let isRecording = false;
let recognition = null;
let finalTranscript = '';
let interimTranscript = '';
let recordingStartTime = 0;
let timerInterval = null;
let timerSeconds = 120;
let totalTimer = 120;
let practiceSessions = [];
let speaking = false;
let currentAnalysis = null; // stored for tab switching

// ===== INIT =====
function initRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById('btnRecord').disabled = true;
    document.getElementById('btnRecord').textContent = '⚠️ Chrome required for speech';
    document.getElementById('btnRecord').style.fontSize = '11px';
    return false;
  }
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  recognition.onresult = (event) => {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript + ' ';
      else interim += event.results[i][0].transcript;
    }
    updateTranscript(finalTranscript, interim);
  };
  recognition.onerror = (e) => { if (e.error !== 'no-speech' && e.error !== 'aborted') console.error(e.error); };
  recognition.onend = () => { if (isRecording) { try { recognition.start(); } catch(e) {} } };
  return true;
}
initRecognition();

function pickQuestion(cat) {
  currentCat = cat;
  const pool = questions[cat];
  const qd = pool[Math.floor(Math.random() * pool.length)];
  currentQuestionData = qd;
  currentQuestion = { q: qd.q, hint: qd.hint };
  document.getElementById('qCategory').textContent = (catLabels[cat] || cat) + ' · 模拟面试';
  document.getElementById('qText').textContent = qd.q;
  const hEl = document.getElementById('qHint');
  if (qd.hint) { hEl.textContent = '💡 ' + qd.hint; hEl.classList.remove('hidden'); }
  else hEl.classList.add('hidden');
  resetForNewQuestion();
  updatePickerActive();
}

function pickRandomQuestion() {
  const cats = Object.keys(questions);
  pickQuestion(cats[Math.floor(Math.random() * cats.length)]);
}

function updatePickerActive() {
  document.querySelectorAll('.picker-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === currentCat));
}

function resetForNewQuestion() {
  stopAll();
  finalTranscript = ''; interimTranscript = ''; currentAnalysis = null;
  document.getElementById('transcriptLive').innerHTML = '<span class="transcript-placeholder">点击「开始回答」然后开口说</span>';
  document.getElementById('analysisPanel').classList.remove('show');
  document.getElementById('speechStage').classList.remove('recording', 'done');
  document.getElementById('recIndicator').classList.remove('show');
  document.getElementById('btnRecord').classList.remove('hidden');
  document.getElementById('btnStop').classList.add('hidden');
  document.getElementById('btnReplay').classList.add('hidden');
  document.getElementById('btnRetry').classList.add('hidden');
  document.getElementById('btnRecord').disabled = false;
  document.getElementById('previewPanel').classList.add('hidden');
  document.getElementById('previewPanel').innerHTML = '';
  document.getElementById('btnPreview').textContent = '👁️ 答题前先看完美答案结构';
  resetTimer();
}

function nextQuestion() { pickQuestion(currentCat); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function retryQuestion() {
  stopAll();
  finalTranscript = ''; interimTranscript = ''; currentAnalysis = null;
  document.getElementById('transcriptLive').innerHTML = '<span class="transcript-placeholder">点击「开始回答」然后开口说</span>';
  document.getElementById('analysisPanel').classList.remove('show');
  document.getElementById('speechStage').classList.remove('recording', 'done');
  document.getElementById('recIndicator').classList.remove('show');
  document.getElementById('btnRecord').classList.remove('hidden');
  document.getElementById('btnStop').classList.add('hidden');
  document.getElementById('btnReplay').classList.add('hidden');
  document.getElementById('btnRetry').classList.add('hidden');
  document.getElementById('btnRecord').disabled = false;
  resetTimer();
}

function togglePreview() {
  const panel = document.getElementById('previewPanel');
  const btn = document.getElementById('btnPreview');
  const model = currentQuestionData?.model;

  if (!panel.classList.contains('hidden')) {
    panel.classList.add('hidden');
    panel.innerHTML = '';
    btn.textContent = '👁️ 答题前先看完美答案结构';
    return;
  }

  if (!model) {
    alert('该题暂无预览模型答案。选一道标有完整答案的题试试。');
    return;
  }

  let html = '';
  if (model.modelAnswer && model.modelAnswer.length) {
    html += '<div style="font-weight:700;color:var(--text);margin-bottom:8px;">📐 完美答案结构预览</div>';
    model.modelAnswer.forEach(phase => {
      html += `<div class="preview-phase"><div class="preview-phase-label">${phase.phase}</div><div class="preview-phase-text">${phase.text}</div></div>`;
    });
  }
  if (model.commonMistakes && model.commonMistakes.length) {
    html += '<div class="preview-mistakes"><div class="preview-mistakes-title">⚠️ 练习时避开这些错误</div>';
    model.commonMistakes.forEach(m => { html += `<div style="font-size:12px;color:var(--text2);margin-top:2px;">• ${m}</div>`; });
    html += '</div>';
  }
  if (model.checkpoints && model.checkpoints.length) {
    html += '<div style="margin-top:10px;font-size:12px;color:var(--text2);">';
    html += '<div style="font-weight:600;color:var(--text);margin-bottom:4px;">🎯 评分检查点：</div>';
    model.checkpoints.forEach(cp => {
      html += `<div>• ${cp.name}（权重 ${cp.weight}分）</div>`;
    });
    html += '</div>';
  }

  panel.innerHTML = html;
  panel.classList.remove('hidden');
  btn.textContent = '👁️ 收起预览';
}

function stopAll() {
  if (isRecording) stopAnsweringSilent();
  if (speaking) { window.speechSynthesis.cancel(); speaking = false; }
}

// ===== SPEECH =====
function startAnswering() {
  if (!recognition) { alert('语音识别需要 Chrome 浏览器。请用 Chrome 打开。'); return; }
  if (!speaking && currentQuestionData) { speakQuestion(() => actuallyStartRecording()); }
  else actuallyStartRecording();
}

function actuallyStartRecording() {
  isRecording = true; finalTranscript = ''; interimTranscript = ''; recordingStartTime = Date.now();
  document.getElementById('speechStage').classList.add('recording');
  document.getElementById('recIndicator').classList.add('show');
  document.getElementById('btnRecord').classList.add('hidden');
  document.getElementById('btnStop').classList.remove('hidden');
  document.getElementById('btnReplay').classList.add('hidden');
  document.getElementById('btnRetry').classList.add('hidden');
  document.getElementById('analysisPanel').classList.remove('show');
  document.getElementById('transcriptLive').innerHTML = '';
  try { recognition.start(); } catch(e) {}
  if (currentCat === 'behavioral') totalTimer = 120;
  else if (currentCat === 'sysdesign') totalTimer = 600;
  else if (currentCat === 'tech') totalTimer = 300;
  else totalTimer = 180;
  timerSeconds = totalTimer;
  startTimer();
}

function stopAnswering() { stopAnsweringSilent(); runFullAnalysis(); }
function stopAnsweringSilent() {
  isRecording = false;
  try { recognition.stop(); } catch(e) {}
  clearInterval(timerInterval);
  document.getElementById('speechStage').classList.remove('recording');
  document.getElementById('speechStage').classList.add('done');
  document.getElementById('recIndicator').classList.remove('show');
  document.getElementById('btnRecord').classList.add('hidden');
  document.getElementById('btnStop').classList.add('hidden');
  document.getElementById('btnReplay').classList.remove('hidden');
  document.getElementById('btnRetry').classList.remove('hidden');
}

function updateTranscript(final, interim) {
  const el = document.getElementById('transcriptLive');
  const ph = document.getElementById('transcriptPlaceholder');
  if (ph) ph.style.display = 'none';
  let html = '';
  if (final) html += '<span>' + escapeHtml(final) + '</span>';
  if (interim) html += '<span class="interim">' + escapeHtml(interim) + '</span>';
  if (!final && !interim) html = '<span class="transcript-placeholder">我在听...请继续</span>';
  el.innerHTML = html;
}

function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

// ===== TTS =====
function speakQuestion(callback) {
  if (!currentQuestionData) { if (callback) callback(); return; }
  window.speechSynthesis.cancel();
  const text = currentQuestionData.q.replace(/\([^)]*\)/g, '').replace(/\//g, ' ');
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.95; u.pitch = 1.0;
  const voices = window.speechSynthesis.getVoices();
  const ev = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google')) || voices.find(v => v.lang.startsWith('en-US')) || voices.find(v => v.lang.startsWith('en'));
  if (ev) u.voice = ev;
  u.onend = () => { speaking = false; if (callback) callback(); };
  u.onerror = () => { speaking = false; if (callback) callback(); };
  speaking = true;
  window.speechSynthesis.speak(u);
}
window.speechSynthesis.onvoiceschanged = () => {};

function replayQuestion() {
  if (speaking) window.speechSynthesis.cancel();
  speaking = false;
  setTimeout(() => speakQuestion(), 100);
}

// ===== TIMER =====
function startTimer() {
  updateTimerDisplay();
  document.getElementById('timerLabel').textContent = '回答中...';
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerSeconds--;
    updateTimerDisplay();
    if (timerSeconds <= 0) { clearInterval(timerInterval); document.getElementById('timerLabel').textContent = '⏰ 时间到'; stopAnswering(); }
  }, 1000);
}

function resetTimer() {
  clearInterval(timerInterval);
  timerSeconds = totalTimer;
  updateTimerDisplay();
  document.getElementById('timerLabel').textContent = '准备就绪';
  document.getElementById('timerBar').style.width = '100%';
  document.getElementById('timerBar').classList.remove('warn', 'danger');
}

function updateTimerDisplay() {
  const m = Math.floor(timerSeconds / 60), s = timerSeconds % 60;
  document.getElementById('timerClock').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const pct = totalTimer > 0 ? (timerSeconds / totalTimer * 100) : 100;
  const bar = document.getElementById('timerBar');
  bar.style.width = pct + '%';
  bar.classList.remove('warn', 'danger');
  if (pct < 15) bar.classList.add('danger');
  else if (pct < 30) bar.classList.add('warn');
}

// ===== FULL ANALYSIS WITH MODEL COMPARISON =====
function runFullAnalysis() {
  const elapsed = ((Date.now() - recordingStartTime) / 1000).toFixed(1);
  const text = finalTranscript.trim();
  const words = text ? text.split(/\s+/) : [];
  const wordCount = words.length;
  const minutes = parseFloat(elapsed) / 60;
  const wpm = minutes > 0 ? Math.round(wordCount / minutes) : 0;

  // Filler detection
  const fillerWords = ['um','uh','like','you know','i mean','sort of','kind of','basically','actually','literally','so yeah','right'];
  let fillerCount = 0;
  const fillerMap = {};
  fillerWords.forEach(fw => {
    const regex = new RegExp('\\b' + fw.replace(/\s/g, '\\s') + '\\b', 'gi');
    const matches = text.match(regex);
    if (matches) { fillerCount += matches.length; fillerMap[fw] = matches.length; }
  });

  // Checkpoints scoring
  const model = currentQuestionData?.model;
  let checkpointScores = [];
  let totalScore = 0;
  let maxScore = 0;

  if (model && model.checkpoints) {
    const lower = text.toLowerCase();
    model.checkpoints.forEach(cp => {
      let score = 0;
      const weight = cp.weight || 10;
      maxScore += weight;

      if (cp.special === 'iwe') {
        const ic = (text.match(/\bi\s/gmi) || []).length;
        const wc = (text.match(/\bwe\s/gmi) || []).length;
        score = ic > wc * 2 ? weight : ic > wc ? Math.round(weight * 0.6) : Math.round(weight * 0.2);
      } else if (cp.special === 'noblame') {
        const blameWords = ['his fault','her fault','their fault','they messed','they screwed','they broke','he screwed','she messed'];
        const hasBlame = blameWords.some(b => lower.includes(b));
        score = hasBlame ? 0 : weight;
      } else if (cp.special === 'nodefensive') {
        const defWords = ['unfair','wrong about','not true','didn\'t deserve','overreacted','too harsh'];
        const hasDefensive = defWords.some(d => lower.includes(d));
        score = hasDefensive ? Math.round(weight * 0.2) : weight;
      } else if (cp.detect) {
        const hits = cp.detect.filter(kw => lower.includes(kw)).length;
        const ratio = Math.min(hits / Math.max(cp.detect.length * 0.4, 1), 1);
        score = Math.round(weight * ratio);
      }
      totalScore += score;
      checkpointScores.push({ ...cp, score, weight });
    });
  }

  const pctScore = maxScore > 0 ? Math.round(totalScore / maxScore * 100) : 0;
  const grade = pctScore >= 80 ? 'great' : pctScore >= 60 ? 'good' : pctScore >= 35 ? 'fair' : 'weak';
  const gradeLabel = { great:'优秀', good:'良好', fair:'需改进', weak:'需要大量练习' };

  // Store analysis for tab switching
  currentAnalysis = { elapsed, text, words, wordCount, wpm, fillerCount, fillerMap, checkpointScores, totalScore, maxScore, pctScore, grade, gradeLabel, model };

  // Render all sections
  renderOverallScore();
  renderDimensionTable();
  renderYourAnswer();
  renderModelAnswer();
  renderGapAnalysis();
  renderStarCheck();
  renderImprovementPlan();

  // Show analysis
  document.getElementById('analysisPanel').classList.add('show');
  // Reset subtabs
  document.querySelectorAll('.model-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('[data-subtab="gapAnalysis"]').classList.add('active');
  document.getElementById('subtab-yourAnswer').classList.add('hidden');
  document.getElementById('subtab-modelAnswer').classList.add('hidden');
  document.getElementById('subtab-gapAnalysis').classList.remove('hidden');

  // Save session
  practiceSessions.push({
    cat: currentCat, question: currentQuestionData?.q || '', wordCount, elapsed: parseFloat(elapsed), wpm, fillerCount, score: pctScore, grade, date: new Date().toISOString()
  });
  renderHistory();
}

function renderOverallScore() {
  const a = currentAnalysis;
  document.getElementById('overallScoreCircle').textContent = a.pctScore + '%';
  document.getElementById('overallScoreCircle').className = 'score-circle ' + a.grade;
  document.getElementById('overallScoreBreakdown').innerHTML = `
    <span class="sbl">${a.gradeLabel[a.grade]}</span> — 覆盖了 ${a.totalScore}/${a.maxScore} 个检查点得分<br>
    ${a.wordCount} 词 · ${a.elapsed}s · ${a.wpm} wpm · ${a.fillerCount} 个填充词
  `;
}

function renderDimensionTable() {
  const a = currentAnalysis;
  if (!a.checkpointScores.length) {
    document.getElementById('dimensionTable').innerHTML = '<p style="font-size:13px;color:var(--text2);">该题型无预设检查点。</p>';
    return;
  }
  let html = '<table class="checkpoint-table"><thead><tr><th>检查点</th><th>满分</th><th>得分</th><th>如何改进</th></tr></thead><tbody>';
  a.checkpointScores.forEach(cp => {
    const pct = cp.weight > 0 ? Math.round(cp.score / cp.weight * 100) : 0;
    const color = pct >= 70 ? 'var(--green)' : pct >= 30 ? 'var(--amber)' : 'var(--red)';
    html += `<tr>
      <td class="cp-name">${cp.name}</td>
      <td class="cp-score">${cp.weight}</td>
      <td class="cp-score" style="color:${color}">${cp.score}</td>
      <td class="cp-fix">${cp.score >= cp.weight * 0.7 ? '✅ 覆盖良好' : cp.score > 0 ? '⚠️ 部分覆盖，需补充细节' : '❌ 未覆盖，这是关键失分点'}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('dimensionTable').innerHTML = html;
}

function renderYourAnswer() {
  const a = currentAnalysis;
  let html = '<div class="full-transcript">';
  if (!a.text) {
    html += '<span style="color:var(--text2)">（未检测到语音内容）</span>';
  } else {
    let highlighted = escapeHtml(a.text);
    Object.keys(a.fillerMap).forEach(fw => {
      const esc = fw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp('\\b(' + esc.replace(/\s/g, '\\s') + ')\\b', 'gi');
      highlighted = highlighted.replace(regex, '<span class="highlight-filler">$1</span>');
    });
    html += highlighted;
  }
  html += '</div>';
  document.getElementById('subtab-yourAnswer').innerHTML = html;
  document.getElementById('subtab-yourAnswer').classList.remove('hidden');
}

function renderModelAnswer() {
  const model = currentAnalysis?.model;
  if (!model || !model.modelAnswer) {
    document.getElementById('subtab-modelAnswer').innerHTML = '<p style="font-size:13px;color:var(--text2);">该题暂无模型答案。</p>';
    return;
  }
  let html = '<div class="model-answer-box">';
  model.modelAnswer.forEach(phase => {
    html += `<div class="phase"><div class="phase-label">${phase.phase}</div><div class="phase-text">${phase.text}</div></div>`;
  });
  if (model.commonMistakes && model.commonMistakes.length) {
    html += '<div style="margin-top:16px;padding-top:12px;border-top:1px solid #bbf7d0;">';
    html += '<div style="font-weight:700;color:#15803d;font-size:12px;margin-bottom:6px;">⚠️ 常见错误（别犯这些）</div>';
    model.commonMistakes.forEach(m => { html += `<div style="font-size:12px;color:var(--text2);">• ${m}</div>`; });
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('subtab-modelAnswer').innerHTML = html;
}

function renderGapAnalysis() {
  const a = currentAnalysis;
  const model = a?.model;
  if (!model || !a.checkpointScores.length) {
    document.getElementById('subtab-gapAnalysis').innerHTML = '<p style="font-size:13px;color:var(--text2);">该题暂无差距分析。</p>';
    return;
  }

  let html = '<div style="font-size:13px;">';
  const missed = a.checkpointScores.filter(cp => cp.score < cp.weight * 0.5);
  const partial = a.checkpointScores.filter(cp => cp.score >= cp.weight * 0.5 && cp.score < cp.weight * 0.7);
  const ok = a.checkpointScores.filter(cp => cp.score >= cp.weight * 0.7);

  if (missed.length === 0 && partial.length === 0) {
    html += '<p style="color:var(--green);font-weight:600;">🎉 所有检查点都覆盖得不错！继续精进细节。</p>';
  }

  if (missed.length > 0) {
    html += '<p style="font-weight:700;color:var(--red);margin-bottom:8px;">🔴 关键缺失 — 这些是面试官最看重的维度：</p>';
    missed.forEach(cp => {
      html += `<div class="gap-row">
        <div class="gap-icon">❌</div>
        <div class="gap-content">
          <div class="gap-label">${cp.name}（得分 ${cp.score}/${cp.weight}）</div>
          <div class="gap-detail">你的回答中没有检测到相关内容。这是你在真实面试中会丢分的地方。</div>
          ${cp.detect ? `<div class="gap-miss">💡 试着包含这些要素：${cp.detect.filter(kw => !a.text.toLowerCase().includes(kw)).slice(0,5).join('、')}</div>` : ''}
        </div>
      </div>`;
    });
  }

  if (partial.length > 0) {
    html += '<p style="font-weight:700;color:var(--amber);margin:12px 0 8px;">🟡 部分覆盖 — 有提到但不够深入：</p>';
    partial.forEach(cp => {
      const found = cp.detect ? cp.detect.filter(kw => a.text.toLowerCase().includes(kw)) : [];
      const missing = cp.detect ? cp.detect.filter(kw => !a.text.toLowerCase().includes(kw)).slice(0,3) : [];
      html += `<div class="gap-row">
        <div class="gap-icon">⚠️</div>
        <div class="gap-content">
          <div class="gap-label">${cp.name}（得分 ${cp.score}/${cp.weight}）</div>
          <div class="gap-have">✅ 你提到了：${found.join('、') || '部分内容'}</div>
          ${missing.length ? `<div class="gap-miss">💡 还可以补充：${missing.join('、')}</div>` : ''}
        </div>
      </div>`;
    });
  }

  if (ok.length > 0 && (missed.length > 0 || partial.length > 0)) {
    html += '<p style="font-weight:700;color:var(--green);margin:12px 0 8px;">🟢 做得好的地方：</p>';
    ok.forEach(cp => {
      html += `<div class="gap-row">
        <div class="gap-icon">✅</div>
        <div class="gap-content"><div class="gap-label">${cp.name}（得分 ${cp.score}/${cp.weight}）— 覆盖良好</div></div>
      </div>`;
    });
  }

  html += '</div>';
  document.getElementById('subtab-gapAnalysis').innerHTML = html;
}

function renderStarCheck() {
  const card = document.getElementById('starCheckCard');
  const result = document.getElementById('starCheckResult');
  if (currentCat !== 'behavioral') { card.style.display = 'none'; return; }
  card.style.display = '';
  const text = (currentAnalysis?.text || '').toLowerCase();
  const checks = [
    { label:'Situation (背景)', keywords:['team','project','company','we were','i was working','context','background'] },
    { label:'Task (任务)', keywords:['my role','i needed to','goal was','challenge was','i had to','responsible for','my job was'] },
    { label:'Action (行动) — 最重要！', keywords:['i built','i designed','i implemented','i decided','i proposed','i led','i coordinated','i wrote','i created','i chose','i refactored','i optimized','i deployed'] },
    { label:'Result (结果)', keywords:['result','as a result','outcome','impact','improved','reduced','increased','learned','achieved','led to','percent','faster'] },
    { label:'使用了 "I" 而非 "We"', special:true },
  ];
  let starHtml = '';
  checks.forEach(c => {
    let found = false;
    if (c.special) {
      const ic = (text.match(/\bi\s/gmi) || []).length;
      const wc = (text.match(/\bwe\s/gmi) || []).length;
      found = ic > wc * 2;
    } else {
      found = c.keywords.some(kw => text.includes(kw));
    }
    starHtml += `<p>${found ? '✅' : '⚠️'} <strong>${c.label}</strong> — ${found ? '已检测到' : '未检测到，建议添加'}</p>`;
  });
  result.innerHTML = starHtml;
}

function renderImprovementPlan() {
  const a = currentAnalysis;
  const tips = [];

  if (a.wordCount < 50) tips.push('回答偏短。即使内容好，太短会让面试官觉得你不想展开。');
  if (a.fillerCount > 5) tips.push(`减少填充词（"um"、"like" 等 ${a.fillerCount} 个）。录音回听 + 刻意停顿练习。`);
  if (currentCat === 'behavioral' && a.wordCount > 400) tips.push('行为面试回答偏长，控制在 90 秒-2 分钟。精炼 Action 部分。');
  if (a.wpm > 200) tips.push(`语速偏快（${a.wpm} wpm），120-160 wpm 最舒适。关键处刻意停顿。`);
  if (a.wpm < 80 && a.wordCount > 30) tips.push('语速可适当加快，但清晰比快重要。');

  // Model-specific tips based on weakest checkpoints
  if (a.checkpointScores.length > 0) {
    const sorted = [...a.checkpointScores].sort((x, y) => (x.score/x.weight) - (y.score/y.weight));
    const worst = sorted[0];
    if (worst && worst.score < worst.weight * 0.5) {
      tips.push(`重点攻克：「${worst.name}」— 这是你当前最大的失分点。看上面的完美答案，模仿它的表述方式。`);
    }
    if (sorted.length > 1 && sorted[1].score < sorted[1].weight * 0.5) {
      tips.push(`次要攻克：「${sorted[1].name}」— 建议看完完美答案后，立刻再练一遍本题。`);
    }
  }

  tips.push('推荐操作：看完「完美答案」和「差距分析」后，点击「按建议重新练习」再答一次，对比两次的分析结果看进步。');

  document.getElementById('improvementPlan').innerHTML = tips.map(t => `<p>• ${t}</p>`).join('');
}

// ===== SUBTAB SWITCHING =====
document.addEventListener('click', (e) => {
  if (!e.target.classList.contains('model-tab')) return;
  const subtab = e.target.dataset.subtab;
  document.querySelectorAll('.model-tab').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById('subtab-yourAnswer').classList.add('hidden');
  document.getElementById('subtab-modelAnswer').classList.add('hidden');
  document.getElementById('subtab-gapAnalysis').classList.add('hidden');
  document.getElementById('subtab-' + subtab).classList.remove('hidden');
});

// ===== HISTORY =====
function renderHistory() {
  const el = document.getElementById('practiceHistory');
  if (practiceSessions.length === 0) { el.innerHTML = '还没有练习记录'; return; }
  el.innerHTML = practiceSessions.slice(-10).reverse().map((s, i) => {
    const shortQ = s.question.length > 45 ? s.question.slice(0, 45) + '...' : s.question;
    return `<div style="padding:4px 0;border-bottom:1px solid var(--border);">${i+1}. <span style="color:var(--accent);font-weight:600;">${catLabels[s.cat]}</span> — ${shortQ} — ${s.wordCount}词·${s.wpm}wpm·评分 <span style="font-weight:700;color:${s.grade==='great'?'var(--green)':s.grade==='good'?'var(--accent)':s.grade==='fair'?'var(--amber)':'var(--red)'}">${s.score}%</span></div>`;
  }).join('');
}

// ===== PICKER =====
document.getElementById('pickerGrid').addEventListener('click', (e) => {
  if (!e.target.classList.contains('picker-btn')) return;
  pickQuestion(e.target.dataset.cat);
});

pickQuestion('behavioral');
updateTimerDisplay();

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input,select,textarea')) return;
  if (e.code === 'Space' && !isRecording && !speaking) { e.preventDefault(); startAnswering(); }
  else if (e.code === 'Space' && isRecording) { e.preventDefault(); stopAnswering(); }
  else if (e.code === 'KeyR' && !e.ctrlKey && !e.metaKey) replayQuestion();
});

window.speechSynthesis.getVoices();
</script>
